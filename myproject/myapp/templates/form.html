<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #333;
            --color-secondary: #555;
            --color-border: #ddd;
            --color-bg-light: #f0f0f0;
            --color-bg-white: #fff;
            --color-bg-hover: #e0e0e0;
            --font-family: Arial, sans-serif;
            --spacing-xs: 8px;
            --spacing-sm: 15px;
            --spacing-md: 20px;
            --spacing-lg: 30px;
            --spacing-xl: 40px;
            --border-radius: 4px;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg-light);
            padding: var(--spacing-md);
        }

        .navbar {
            background-color: var(--color-bg-white);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--border-radius);
        }

        .navbar h1 {
            font-size: 24px;
            color: var(--color-primary);
        }

        .nav-links {
            display: flex;
            gap: var(--spacing-sm);
        }

        .nav-links a {
            color: var(--color-primary);
            text-decoration: none;
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            transition: background-color 0.3s;
        }

        .nav-links a:hover {
            background-color: var(--color-bg-hover);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--color-bg-white);
            padding: var(--spacing-xl);
            border-radius: var(--border-radius);
            border: 1px solid var(--color-border);
        }

        h2 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            font-size: 28px;
        }

        p {
            color: var(--color-secondary);
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        label {
            display: block;
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            font-family: var(--font-family);
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(51, 51, 51, 0.1);
        }

        .btn {
            padding: var(--spacing-xs) var(--spacing-sm);
            text-decoration: none;
            border: 1px solid var(--color-primary);
            border-radius: var(--border-radius);
            color: var(--color-primary);
            cursor: pointer;
            background-color: var(--color-bg-white);
            font-family: var(--font-family);
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: var(--color-bg-hover);
        }

        .form-container {
            background-color: #f9f9f9;
            padding: var(--spacing-lg);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            margin-top: var(--spacing-lg);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>My App</h1>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'about' %}">About</a>
            <a href="{% url 'shoping' %}">Shoping</a>
            <a href="{% url 'form' %}">Form</a>
        </div>
    </div>

    <div class="container">
        <h2>Welcome</h2>
        <p>Please fill out the form below to get started.</p>

        <div class="form-container">
            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email">
                </div>
                <button type="submit" class="btn" style="margin-top: var(--spacing-md);">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
