<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .navbar {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 24px;
            color: #333;
        }
        .navbar a {
            color: #333;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        .navbar a:hover {
            background-color: #e0e0e0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 40px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .info {
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .info p {
            margin: 10px 0;
            color: #555;
        }
        .info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Dashboard</h1>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <div class="container">
        <h2>Welcome, {{ user.username }}!</h2>
        
        <div class="info">
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Username:</strong> {{ user.username }}</p>
            <p><strong>Member Since:</strong> {{ user.date_joined|date:"F j, Y" }}</p>
        </div>

        <p>You are successfully logged in. This page is only accessible to authenticated users.</p>
    </div>
</body>
</html>
