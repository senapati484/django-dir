<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>About</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #333;
            --color-secondary: #555;
            --color-border: #ddd;
            --color-bg-light: #f0f0f0;
            --color-bg-white: #fff;
            --color-bg-hover: #e0e0e0;
            --font-family: Arial, sans-serif;
            --spacing-xs: 8px;
            --spacing-sm: 15px;
            --spacing-md: 20px;
            --spacing-lg: 30px;
            --spacing-xl: 40px;
            --border-radius: 4px;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg-light);
            padding: var(--spacing-md);
        }

        .navbar {
            background-color: var(--color-bg-white);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--border-radius);
        }

        .navbar h1 {
            font-size: 24px;
            color: var(--color-primary);
        }

        .nav-links {
            display: flex;
            gap: var(--spacing-sm);
        }

        .nav-links a {
            color: var(--color-primary);
            text-decoration: none;
            padding: var(--spacing-xs) var(--spacing-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            transition: background-color 0.3s;
        }

        .nav-links a:hover {
            background-color: var(--color-bg-hover);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--color-bg-white);
            padding: var(--spacing-xl);
            border-radius: var(--border-radius);
            border: 1px solid var(--color-border);
        }

        h2 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
            font-size: 28px;
        }

        p {
            color: var(--color-secondary);
            line-height: 1.6;
            margin-bottom: var(--spacing-md);
        }

        .info-box {
            background-color: #f9f9f9;
            padding: var(--spacing-lg);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius);
            margin-top: var(--spacing-lg);
        }

        .info-box h3 {
            color: var(--color-primary);
            margin-bottom: var(--spacing-md);
        }
    </style>
    </head>
    <body>
        <div class="navbar">
            <h1>My App</h1>
            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% url 'shoping' %}">Shoping</a>
                <a href="{% url 'form' %}">Form</a>
            </div>
        </div>

        <div class="container">
            <h2>{{ title }}</h2>
            <p>{{ content }}</p>

            <div class="info-box">
                <h3>Products</h3>

                <div
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">

                    {% for item in items %}
                    <div
                        style="border:1px solid #ddd; padding:15px; border-radius:8px; background:#fff; text-align:center; transition:0.3s;">

                        <img src="{{ item.image }}" alt="{{ item.name }}"
                            style="width:100%; height:150px; object-fit:cover; border-radius:6px; margin-bottom:10px;">

                        <h4>{{ item.name }}</h4>
                        <p style="font-weight:bold; color:#333;">{{ item.price }}</p>

                        <button style="
                    padding:8px 15px;
                    background:#333;
                    color:white;
                    border:none;
                    border-radius:4px;
                    cursor:pointer;
                    transition:0.3s;
                "
                            onmouseover="this.style.background='#555'"
                            onmouseout="this.style.background='#333'">
                            Buy Now
                        </button>
                    </div>
                    {% empty %}
                    <p>No products available.</p>
                    {% endfor %}

                </div>
            </div>
        </body>
    </html>
