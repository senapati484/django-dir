<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: white;
            border-bottom: 1px solid #ddd;
            border-radius: 20px 0 20px 0;
            margin-top: 20px;
        }

        h1 {
            font-size: 22px;
            color: #333;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            background-color: #f5f5f5;
            padding: 6px 12px;
            border: 1px solid #ddd;
            transition: 0.2s;
            border-radius: 10px 0 10px 0;
        }

        nav a:hover {
            background: #eee;
        }

        main {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 2rem;
            margin-top: 20px;
            border-radius: 20px 0 20px 0;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <header>
        <h1>Todo App</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'dj' %}">DJ</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
